<section class="home-screen">
  <div class="home-card">
    <p class="eyebrow">Soirée souvenirs</p>
    <h1>{{ appTitle }}</h1>
    <p class="subtitle">Des souvenirs, des schlouks et des sauces</p>

    <div class="field-group">
      <label>Difficulté</label>
      <div class="chip-row difficulty-options" role="group" aria-label="Difficulté">
        <button
          type="button"
          *ngFor="let option of difficultyOptions"
          class="chip"
          [ngClass]="option === 'random' ? '' : 'difficulty-badge difficulty-' + option"
          [class.active]="selectedDifficulty === option"
          [attr.aria-pressed]="selectedDifficulty === option"
          (click)="selectedDifficulty = option"
        >
          {{ option === 'random' ? 'Aléatoire' : option }}
        </button>
      </div>
    </div>

    <div class="field-group">
      <div class="category-heading">
        <label>Catégorie</label>
        <button
          *ngIf="categoryOptions.length > initialCategoryLimit"
          type="button"
          class="category-toggle"
          [attr.aria-expanded]="showAllCategories"
          (click)="showAllCategories = !showAllCategories"
        >
          {{ showAllCategories ? 'Voir moins' : 'Voir tout (+' + hiddenCategoryCount + ')' }}
        </button>
      </div>
      <div class="chip-row category-options" role="group" aria-label="Catégorie">
        <button
          type="button"
          class="chip category-chip"
          [class.active]="selectedCategory === null"
          [attr.aria-pressed]="selectedCategory === null"
          (click)="selectedCategory = null"
        >
          <span aria-hidden="true">🗂️</span>
          Toutes
        </button>
        <button
          type="button"
          *ngFor="let category of visibleCategoryOptions"
          class="chip category-chip"
          [class.active]="selectedCategory === category.name"
          [attr.aria-pressed]="selectedCategory === category.name"
          (click)="selectedCategory = category.name"
        >
          <span aria-hidden="true">{{ getCategoryIcon(category.name) }}</span>
          {{ category.name }}
          <span class="category-count">{{ category.count }}</span>
        </button>
      </div>
      <p *ngIf="isLoadingCategories" class="field-hint">Chargement des catégories…</p>
      <p *ngIf="categoryErrorMessage" class="error-message" role="status">{{ categoryErrorMessage }}</p>
    </div>

    <div class="field-group">
      <label>Nombre de questions</label>
      <div class="counter" aria-label="Nombre de questions">
        <button type="button" (click)="decrementQuestionCount()">−</button>
        <span>{{ questionCount }}</span>
        <button type="button" (click)="incrementQuestionCount()">+</button>
      </div>
    </div>

    <button type="button" class="cta-button" (click)="startGame()" [disabled]="isStarting || isLoadingCategories">
      {{ isStarting ? 'Chargement…' : 'Commencer' }}
    </button>
    <p *ngIf="errorMessage" class="error-message" role="alert">{{ errorMessage }}</p>
    <a class="admin-link" routerLink="/admin">
      <span aria-hidden="true">⚙️</span>
      Administration
    </a>
  </div>
</section>
